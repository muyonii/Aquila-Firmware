; ==============================================================================
; AQUILA Physical Node Firmware Configuration
; Node Identifier: NODE-B1-001
; Target Hardware: ESP32-WROOM-32 (240MHz, 4MB Flash)
; ==============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor & Upload Settings
monitor_speed = 115200
upload_speed = 921600

; Flash Filesystem Configuration
board_build.filesystem = littlefs

; Build Flags (Enables clean C++17 compilation and reduces log noise)
build_flags = 
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1

; External Library Dependencies
lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.3